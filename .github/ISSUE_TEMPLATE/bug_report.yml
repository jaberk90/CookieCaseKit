name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: CookieCaseKit and Node versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction and expected behavior
      description: Include a minimal example without credentials or customer data.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
