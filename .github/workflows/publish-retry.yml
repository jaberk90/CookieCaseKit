name: Retry npm publication
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.2.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require an existing GitHub release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected a stable vX.Y.Z tag');
            const {data} = await github.rest.repos.getReleaseByTag({...context.repo,tag});
            if (data.draft || data.prerelease) throw new Error('A published stable release is required');
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm publish --access public --provenance
