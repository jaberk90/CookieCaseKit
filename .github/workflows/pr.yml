name: PR conventions
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            if (!/^(feat|fix|docs|chore|refactor|test|ci|build|perf|revert)(\([^)]+\))?!?: .+/.test(title)) {
              core.setFailed('Use a Conventional Commit title, e.g. feat: add case assignment');
            }
