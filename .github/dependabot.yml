version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: '17 2 * * *'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'fix(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '37 2 * * *'
      timezone: America/Los_Angeles
    commit-message:
      prefix: 'ci(deps)'
